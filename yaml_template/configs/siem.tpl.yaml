# ----------------------------------------------
# НАСТРОЙКИ ИНТЕГРАЦИИ С SIEM ЧЕРЕЗ KAFKA
# ----------------------------------------------


# Включена ли интеграция с SIEM.
# При значении kafka приложение отправляет события в Kafka, и стек интеграции
# поднимается. При none отправка не производится, стек интеграции
# останавливается.
#
# Тип данных: строка, kafka\none
siem.enabled_driver: "none"

# Порт, на котором Kafka принимает внешние подключения SIEM.
#
# Тип данных: число
# Пример: siem.driver_data.listen_port: 9094
siem.driver_data.listen_port: 9094

# Имя пользователя Kafka, под которым SIEM подключается для чтения событий.
# Пользователю выдаётся доступ только на чтение топика raw.events.
#
# Тип данных: строка
# Пример: siem.driver_data.user: "siem"
siem.driver_data.user: ""

# Пароль пользователя из siem.driver_data.user.
# Внимание: файл siem.yaml содержит секрет — ограничьте права доступа к файлу.
# В пароле не используйте символы "," и "]", а также символ "!" в начале.
#
# Тип данных: строка
siem.driver_data.password: ""

# Срок хранения событий в часах.
# Тип данных: число
siem.driver_data.storage_time: 72

# Идентификатор consumer-группы Kafka, под которой SIEM-коннектор читает
# топик raw.events. По этому имени update-скрипт выдаёт пользователю
# siem.driver_data.user право READ на consumer-группу — без него брокер запретит
# чтение (allow.everyone.if.no.acl.found=false). Значение должно совпадать
# с group.id, настроенным на стороне SIEM-коннектора.
#
# Тип данных: строка
siem.driver_data.consumer_group_id: ""
